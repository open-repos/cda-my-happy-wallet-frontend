name: Feature
description: Propose a user-facing capability or improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: Describe the result from the user's point of view. Keep implementation choices for the solution section.
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Who needs this and what should become possible?
      placeholder: As a user, I want...
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected result
      description: Describe the observable behavior after delivery.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Web
        - Mobile
        - Shared or cross-platform
        - Documentation or delivery
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Add concrete, testable completion criteria.
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Solution notes
      description: Add constraints, dependencies, mockups, or an implementation direction when known.
  - type: input
    id: version
    attributes:
      label: Target version or milestone
      description: Leave empty if prioritization has not been decided.
