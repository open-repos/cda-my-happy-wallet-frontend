name: PWA cache policy proof

on:
  pull_request:
    branches: [develop, main]
    paths:
      - src/**
      - index.html
      - public/**
      - scripts/build-pwa-worker.mjs
      - test/pwa-policy/**
      - test/pwa-build/**
      - test/pwaWorkerBuild.test.mjs
      - test/vitest/pwaCachePolicy.test.js
      - playwright.pwa-policy.config.js
      - playwright.pwa-build.config.js
      - package.json
      - package-lock.json
      - .github/workflows/pwa-policy.yml
  push:
    branches: [develop, main]
    paths:
      - src/**
      - index.html
      - public/**
      - scripts/build-pwa-worker.mjs
      - test/pwa-policy/**
      - test/pwa-build/**
      - test/pwaWorkerBuild.test.mjs
      - test/vitest/pwaCachePolicy.test.js
      - playwright.pwa-policy.config.js
      - playwright.pwa-build.config.js
      - package.json
      - package-lock.json
      - .github/workflows/pwa-policy.yml

permissions:
  contents: read

concurrency:
  group: pwa-policy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  proof:
    name: Isolated PWA cache policy and lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run test/vitest/pwaCachePolicy.test.js
      - run: npm run test:pwa:builder
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pwa:proof
      - run: npm run test:pwa:built
