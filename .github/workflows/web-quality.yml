name: Web quality

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Web format, lint, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Check formatting
        run: npm run format
      - name: Lint
        run: npm run lint
      - name: Test API response contracts
        run: npm run test:api-response
      - name: Test API thunks
        run: npm run test:api-thunk
      - name: Test RAV behavior
        run: npm run test:rav
      - name: Test refresh token behavior
        run: npm run test:refresh-token
      - name: Type-check
        run: npm run type-check
      - name: Run unit tests
        run: npm test
      - name: Build Web application
        run: npm run build
