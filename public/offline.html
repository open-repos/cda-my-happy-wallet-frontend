<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#075E3B" />
    <meta name="robots" content="noindex" />
    <title>Hors connexion — My Happy Wallet</title>
    <style>
      :root {
        color-scheme: light dark;
        --canvas: #f4f9f0;
        --surface: #ffffff;
        --text: #1f2b1d;
        --muted: #5e6875;
        --border: #dce2d8;
        --action: #43553a;
        --action-text: #f4f9f0;
        --focus: #275dad;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --canvas: #43553a;
          --surface: #343625;
          --text: #f4f9f0;
          --muted: #a4b2bc;
          --border: #bfe0a5;
          --action: #ea7c69;
          --action-text: #1f2b1d;
          --focus: #f09d65;
        }
      }
      * {
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        min-height: 100dvh;
        margin: 0;
        padding: clamp(1rem, 4vw, 2rem);
        display: grid;
        place-items: center;
        background: var(--canvas);
        color: var(--text);
        font: 1rem/1.6 system-ui, sans-serif;
      }
      main {
        width: min(100%, 36rem);
        padding: clamp(1.5rem, 5vw, 2.5rem);
        border: 1px solid var(--border);
        border-radius: 1.5rem;
        background: var(--surface);
        text-align: center;
        overflow-wrap: anywhere;
      }
      .brand {
        margin: 0 0 2rem;
        color: var(--muted);
        font-weight: 700;
      }
      svg {
        display: block;
        width: 3rem;
        height: 3rem;
        margin: 0 auto 1.5rem;
        color: var(--action);
      }
      h1 {
        margin: 0 0 1rem;
        font-size: clamp(2rem, 6vw, 2.75rem);
        line-height: 1.2;
      }
      .explanation {
        margin: 0 0 1.5rem;
      }
      a {
        display: inline-flex;
        min-height: 2.75rem;
        align-items: center;
        justify-content: center;
        padding: 0.75rem 1.75rem;
        border-radius: 0.75rem;
        background: var(--action);
        color: var(--action-text);
        font-weight: 700;
        text-decoration: none;
      }
      a:hover {
        text-decoration: underline;
      }
      a:focus-visible {
        outline: 3px solid var(--focus);
        outline-offset: 4px;
      }
      .notice {
        margin: 1.5rem 0 0;
        color: var(--muted);
        font-size: 0.875rem;
      }
    </style>
  </head>
  <body>
    <main aria-labelledby="offline-title">
      <p class="brand">My Happy Wallet</p>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.75"
        stroke-linecap="round"
        aria-hidden="true"
      >
        <path
          d="M3 3l18 18M4 8a13 13 0 0 1 2-1M10 5.2A13 13 0 0 1 21 8M7 12a8 8 0 0 1 3-1.1M14 11.1a8 8 0 0 1 3 1M10 16a3 3 0 0 1 4 0"
        />
        <circle cx="12" cy="20" r="0.5" />
      </svg>
      <h1 id="offline-title">Vous êtes hors ligne</h1>
      <p class="explanation">
        Vérifiez votre connexion internet, puis réessayez.
      </p>
      <a href="/">Réessayer</a>
      <p class="notice">Votre budget n’est pas accessible hors connexion.</p>
    </main>
  </body>
</html>
