image: node:22-bookworm

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS"
      when: never
    - if: "$CI_COMMIT_BRANCH"

default:
  interruptible: true
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - validate
  - test
  - build
  - deploy

.branch_or_merge_request:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: "$CI_COMMIT_BRANCH"

.mobile_changes:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      changes:
        - .gitlab-ci.yml
        - mobile/**/*
    - if: "$CI_COMMIT_BRANCH"
      changes:
        - .gitlab-ci.yml
        - mobile/**/*

quality:
  stage: validate
  extends: .branch_or_merge_request
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run format
    - npm run lint

mobile_quality:
  stage: validate
  extends: .mobile_changes
  cache:
    key:
      files:
        - mobile/package-lock.json
    paths:
      - .npm-mobile/
  before_script:
    - cd mobile
    - npm ci --cache ../.npm-mobile --prefer-offline
  script:
    - npm run format
    - npm run lint
    - npm run type-check
    - npm test
    - npm run doctor

tests:
  stage: test
  extends: .branch_or_merge_request
  needs:
    - quality
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:api-response
    - npm run test:api-thunk
    - npm run test:rav
    - npm run test:refresh-token
    - npm run type-check
    - npm test

build:
  stage: build
  extends: .branch_or_merge_request
  needs:
    - quality
    - tests
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    expire_in: 7 days
    paths:
      - dist/

mobile_build:
  stage: build
  extends: .mobile_changes
  needs:
    - mobile_quality
  cache:
    key:
      files:
        - mobile/package-lock.json
    paths:
      - .npm-mobile/
  before_script:
    - cd mobile
    - npm ci --cache ../.npm-mobile --prefer-offline
  script:
    - npm run build:web
  artifacts:
    expire_in: 3 days
    paths:
      - mobile/dist/

deploy_production:
  stage: deploy
  image: debian:bookworm-slim
  interruptible: false
  timeout: 10m
  resource_group: frontend-production
  tags:
    - server_runner_2
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
      when: manual
      allow_failure: false
  environment:
    name: production
    url: https://myhappywallet.andriacapai.com
    deployment_tier: production
  before_script:
    - test -s "$SSH_PRIVATE_KEY"
    - test -s "$SSH_KNOWN_HOSTS"
    - test -n "$SERVER_IP"
    - test -n "$SERVER_USER"
    - test -n "$DEPLOY_PATH"
    - apt-get update && apt-get install --yes --no-install-recommends ca-certificates curl openssh-client rsync
    - install -d -m 700 ~/.ssh
    - chmod 400 "$SSH_PRIVATE_KEY"
    - install -m 644 "$SSH_KNOWN_HOSTS" ~/.ssh/known_hosts
    - eval "$(ssh-agent -s)"
    - ssh-add "$SSH_PRIVATE_KEY"
  script:
    - bash scripts/deploy-production.sh
