image: node:22-bookworm

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS'
      when: never
    - if: '$CI_COMMIT_BRANCH'

default:
  interruptible: true
  tags:
    - server_runner_2
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/

stages:
  - validate
  - test
  - build
  - deploy

.branch_or_merge_request:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH'

quality:
  stage: validate
  extends: .branch_or_merge_request
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run format
    - npm run lint

tests:
  stage: test
  extends: .branch_or_merge_request
  needs:
    - quality
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run test:api-response
    - npm run test:api-thunk
    - npm run test:rav
    - npm run test:refresh-token
    - npm run type-check
    - npm test

build:
  stage: build
  extends: .branch_or_merge_request
  needs:
    - quality
    - tests
  before_script:
    - npm ci --cache .npm --prefer-offline
  script:
    - npm run build
  artifacts:
    expire_in: 1 day
    paths:
      - dist/

deploy_production:
  stage: deploy
  image: debian:bookworm-slim
  interruptible: false
  needs:
    - job: build
      artifacts: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main" && $CI_PIPELINE_SOURCE == "push"'
  environment:
    name: production
    url: https://myhappywallet.andriacapai.com
  before_script:
    - apt-get update && apt-get install --yes openssh-client rsync
    - install -d -m 700 ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
    - chmod 600 ~/.ssh/id_rsa
    - ssh-keyscan -H "$SERVER_IP" > ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    - rsync --archive dist/ "$SERVER_USER@$SERVER_IP:$PATH_DOMAIN."
