name: my-happy-wallet-mobile-dev

services:
  metro:
    image: node:22-bookworm
    init: true
    network_mode: host
    user: "${MHW_HOST_UID:-1000}:${MHW_HOST_GID:-1000}"
    working_dir: /app
    environment:
      EXPO_PUBLIC_API_ORIGIN: ${EXPO_PUBLIC_API_ORIGIN:-http://127.0.0.1:4200}
      EXPO_UNSTABLE_HEADLESS: "1"
      # Node 22 resout `localhost` en ::1 d'abord : sans IPv4, Metro serait
      # injoignable par `adb reverse` et 127.0.0.1 dans l'emulateur (#222).
      NODE_OPTIONS: --dns-result-order=ipv4first
      HOME: /tmp
      npm_config_cache: /tmp/npm-cache
    volumes:
      - ./:/app
      - metro_npm_cache:/tmp/npm-cache
    command: npm run start:dev-client -- --localhost --port 8081
    stop_grace_period: 10s

volumes:
  metro_npm_cache:
